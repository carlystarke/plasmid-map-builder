<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plasmid Map Builder</title>
</head>

<body>

    <main>

        <h1>Plasmid Map Builder</h1>

        <p>
            Create clean, customizable plasmid and genetic construct schematics.
        </p>

        <section>

            <h2>Plasmid Preview</h2>

            <svg
                width="500"
                height="500"
                viewBox="0 0 500 500"
                aria-label="Plasmid map"
            >

                <circle
                    cx="250"
                    cy="250"
                    r="150"
                    fill="none"
                    stroke="#d1d5db"
                    stroke-width="30"
                />

                <text
                    x="250"
                    y="240"
                    text-anchor="middle"
                    font-size="24"
                    font-weight="bold"
                >
                    My Plasmid
                </text>

                <text
                    x="250"
                    y="270"
                    text-anchor="middle"
                    font-size="16"
                    fill="#6b7280"
                >
                    5,000 bp
                </text>

            </svg>

        </section>

    </main>

</body>

</html>
